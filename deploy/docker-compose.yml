# astrogallery on boris (Unraid). Lives in $APPDATA (default /mnt/user/appdata/astrogallery);
# deploy.sh keeps ./app (the generator code), this file and nginx.conf in sync and runs
# `docker compose up -d --build`.
# Nginx Proxy Manager (192.168.1.10) then forwards astro.home.vandekieft.net -> 192.168.1.3:8088.
#
# The builder reads the drop folder read-only and writes ./site; nginx serves ./site.
# GALLERY_DROP comes from ./.env (deploy.sh writes it); the default is a guess at the share path.
services:
  astrogallery:
    image: nginx:alpine
    container_name: astrogallery
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  astrogallery-builder:
    build: ./app
    container_name: astrogallery-builder
    restart: unless-stopped
    volumes:
      - ${GALLERY_DROP:-/mnt/user/telescopes/Gallery}:/data:ro
      - ./site:/site
