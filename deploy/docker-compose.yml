# astrogallery on boris (Unraid). Lives in $APPDATA (default /mnt/user/appdata/astrogallery);
# deploy.sh keeps ./app (the generator code), this file and nginx.conf in sync and runs
# `docker compose up -d --build`.
# Nginx Proxy Manager (192.168.1.10, on br0) can't reach 192.168.1.3:8088, so the astrogallery
# container gets its own LAN address on br0, 192.168.1.7, and NPM forwards
# astro.home.vandekieft.net -> 192.168.1.7:80. (It used to forward by container name over the shared
# `proxynet` bridge, but NPM loses that network whenever it is recreated by an update.) proxynet stays
# so the old name-based route keeps working too. From other LAN machines, 192.168.1.3:8088 no longer answers
# (replies leave via br0): use https://astro.home.vandekieft.net or http://192.168.1.7.
#
# The builder reads the telescopes share read-only (Finished/, Seestar S30 Pro/, Dwarf 3/,
# NINA/, Gallery/)
# and writes ./site; nginx serves ./site.
# GALLERY_ROOT and GALLERY_VERSION (the deployed commit, shown on status.html) come from ./.env
# (deploy.sh writes it).
services:
  astrogallery:
    image: nginx:alpine
    container_name: astrogallery
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/astro  # JSON access log, one file a month (traffic stats)
    # The only container that faces the internet: nothing in it is writable except what nginx
    # needs at runtime, and nothing in it can gain privileges.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    mac_address: 02:42:c0:a8:01:07 # fixed, so UniFi sees one device across recreates
    networks:
      default: {}
      proxynet: {}
      br0:
        ipv4_address: 192.168.1.7 # outside UniFi DHCP (starts at .20); .6 is immich_server
        gw_priority: -1 # keep outbound traffic on the default bridge

  astrogallery-builder:
    build: ./app
    container_name: astrogallery-builder
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GALLERY_VERSION: ${GALLERY_VERSION:-}
    volumes:
      - ${GALLERY_ROOT:-/mnt/user/Telescopes}:/data:ro
      - ./site:/site
      - /etc/localtime:/etc/localtime:ro  # build times in boris's time zone, not UTC

networks:
  proxynet:
    external: true  # created once on boris; Nginx Proxy Manager and immich_server are on it too
  br0:
    external: true  # Unraid's macvlan LAN network (NPM is 192.168.1.10)
