# Serves site/ read-only. Reached on :8088 directly and, as astro.home.vandekieft.net, through
# Nginx Proxy Manager on proxynet, which terminates TLS and sets X-Forwarded-For. Written so the
# site can face the internet: no version string, no builder files, status.html for the LAN only,
# full/ throttled, and headers that leave a browser nothing to run (the site has no JavaScript).

server_tokens off;

# The client's own address when the request came through NPM (or any other proxy on a private
# network), so the LAN check and the per-address limits see the visitor, not the proxy.
# Recursive: a forged X-Forwarded-For from the internet still ends at the address the last
# trusted proxy actually saw.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 1 when the visitor is on the home network (IPv4; the proxies here speak IPv4 to nginx).
geo $lan {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.0/8    1;
}

# Derivative names are stable but rebuilt in place when a source changes, so revalidate
# rather than caching forever. One add_header at server level, because add_header in a
# location would drop every header set above it.
map $uri $cache_control {
    ~*\.jpe?g$  "public, max-age=86400, must-revalidate";
    default     "no-cache";
}

limit_conn_zone $binary_remote_addr zone=astro_full:1m;

# Traffic stats (deploy/PUBLISH.md "Traffic stats"): one JSON line per request in
# /var/log/astro/access-<year>-<month>.json, which a Telegraf container tails into InfluxDB.
# No visitor address is written, only the country Cloudflare attaches; "lan" marks requests
# that came through Nginx Proxy Manager from the home network, "page" is the page or full/
# file that was actually served (status 200), so a scanner's 404 noise never becomes a tag.
map $time_iso8601 $log_month {
    "~^(?<ym>\d{4}-\d{2})"  $ym;  # quoted: a bare { would end the map block
    default               misc;
}
map $uri $kind {
    "/"                        index;
    "/index.html"              index;
    "/status.html"             status;
    "/robots.txt"              robots;
    ~^/img/                    img;
    ~^/full/                   full;
    ~\.css$                    css;
    ~^/[A-Za-z0-9_-]+\.html$   page;
    default                    other;
}
map "$kind:$status" $page_ok {
    "index:200"  1;
    "page:200"   1;
    "full:200"   1;
    default      0;
}
map "$page_ok$uri" $page {
    ~^1(?<p>.*)$  $p;
    default       "-";
}
map $http_cf_ipcountry $country {
    ""       "-";
    default  $http_cf_ipcountry;
}
log_format astro_json escape=json
    '{"ts":"$time_iso8601","ms":$msec,"host":"$host","method":"$request_method","uri":"$uri",'
    '"status":"$status","kind":"$kind","page":"$page","country":"$country","lan":"$lan",'
    '"bytes":$body_bytes_sent,"rt":$request_time,"referer":"$http_referer",'
    '"ua":"$http_user_agent","ray":"$http_cf_ray"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;  # TLS ends at the proxy; a directory redirect must not say http://
    max_ranges 1;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/json;

    add_header Cache-Control $cache_control;
    # The pages are HTML + one stylesheet + images; inline styles are the index filter rules and
    # the goal bars, and the favicon is a data: URI. Nothing else is allowed to load or run.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_conn_status 429;

    access_log /var/log/astro/access-$log_month.json astro_json;
    open_log_file_cache max=4 inactive=1h;  # the name has a variable in it; keep the handle open

    # The builder's working files: .manifest.json and the *.tmp it writes before each os.replace.
    location ~ (/\.|\.tmp$) { return 404; }

    # status.html names share paths in its warnings and, after a failed build, shows the end of
    # the builder log. For the household only; /status too, which try_files below would
    # otherwise map to it.
    location ~ ^/status(\.html)?$ {
        if ($lan = 0) { return 403; }
        try_files $uri $uri.html =404;
    }

    # full/ holds the full-res copies, several MB each: the one place a scraper can eat the
    # uplink. Two downloads at a time per address, each throttled after its first MB.
    location ~ ^/full/ {
        limit_conn astro_full 2;
        limit_rate_after 1m;
        limit_rate 2m;
    }

    # polite crawlers: the site, yes; 360 MB of full-res copies, no
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /full/\nDisallow: /status.html\n";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
