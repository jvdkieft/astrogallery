# Telegraf for the gallery's traffic stats (container astrogallery-stats on boris).
# Two inputs, one output; INFLUX_URL comes from stats.env.

[agent]
  interval = "60s"
  flush_interval = "30s"
  round_interval = true
  hostname = "boris"
  omit_hostname = false
  skip_processors_after_aggregators = false  # silences a 1.40 notice; no processors here

[[outputs.influxdb]]
  urls = ["${INFLUX_URL}"]
  database = "astrogallery"
  skip_database_creation = false
  timeout = "10s"

# Every request nginx served, from the JSON log (deploy/nginx.conf, log_format astro_json).
# Tags: host, method, status, kind (index/page/img/full/css/robots/status/other), page (the
# page or full/ file when it was served with 200, else "-"), country (Cloudflare's two-letter
# code, "-" from the LAN), lan ("1" when the request came through Nginx Proxy Manager).
# Fields: bytes, rt (seconds), uri, referer, ua, ray.
[[inputs.tail]]
  files = ["/logs/access-*.json"]
  initial_read_offset = "end"  # was from_beginning = false before Telegraf 1.38; no state file (read-only)
  watch_method = "poll"
  name_override = "access"
  tagexclude = ["path"]  # the log file name; month is already in the timestamp
  data_format = "json"
  # $msec, seconds with milliseconds: two identical hits in the same second would otherwise be
  # one point in InfluxDB (same series, same timestamp), and the second would be lost.
  json_time_key = "ms"
  json_time_format = "unix"
  tag_keys = ["host", "method", "status", "kind", "page", "country", "lan"]
  json_string_fields = ["uri", "referer", "ua", "ray"]
  [inputs.tail.tags]
    source = "origin"

# What Cloudflare's edge saw for the zone, including the image requests it answered from its
# cache and never sent to boris: cloudflare_zone_requests_total / _cached / _country /
# _status, cloudflare_zone_bandwidth_*, cloudflare_zone_threats_*. The exporter publishes,
# once a minute, the counts of one minute (five minutes back, so it is complete); each
# scrape here stores that minute, so summing the points over time gives the totals. The
# scrape runs at the exporter's own cadence; do not change one without the other
# (SCRAPE_INTERVAL in docker-compose.stats.yml).
[[inputs.prometheus]]
  urls = ["http://astrogallery-cf-exporter:8080/metrics"]
  metric_version = 1      # one measurement per metric (cloudflare_zone_requests_total, ...), field "counter"
  namepass = ["cloudflare_*"]  # not the exporter's own Go runtime metrics
  interval = "60s"
  timeout = "20s"
  [inputs.prometheus.tags]
    source = "edge"
