# Telegraf for the gallery's traffic stats (container astrogallery-stats on boris).
# The access log in, InfluxDB out; INFLUX_URL comes from stats.env. Cloudflare's numbers are
# written by deploy/cfstats.py, not by Telegraf.

[agent]
  interval = "60s"
  flush_interval = "30s"
  round_interval = true
  hostname = "boris"
  omit_hostname = false
  skip_processors_after_aggregators = false  # silences a 1.40 notice; no processors here

[[outputs.influxdb]]
  urls = ["${INFLUX_URL}"]
  database = "astrogallery"
  skip_database_creation = false
  timeout = "10s"

# Every request nginx served, from the JSON log (deploy/nginx.conf, log_format astro_json).
# Tags: host, method, status, kind (index/page/img/full/css/robots/status/other), page (the
# page or full/ file when it was served with 200, else "-"), country (Cloudflare's two-letter
# code, "-" from the LAN), region (US state, or a province elsewhere) and city, lan ("1" when the request came through Nginx Proxy Manager).
# Fields: bytes, rt (seconds), uri, referer, ua, ray.
[[inputs.tail]]
  files = ["/logs/access-*.json"]
  initial_read_offset = "end"  # was from_beginning = false before Telegraf 1.38; no state file (read-only)
  watch_method = "poll"
  name_override = "access"
  tagexclude = ["path"]  # the log file name; month is already in the timestamp
  data_format = "json"
  # $msec, seconds with milliseconds: two identical hits in the same second would otherwise be
  # one point in InfluxDB (same series, same timestamp), and the second would be lost.
  json_time_key = "ms"
  json_time_format = "unix"
  tag_keys = ["host", "method", "status", "kind", "page", "country", "region", "city", "lan"]
  json_string_fields = ["uri", "referer", "ua", "ray"]
  [inputs.tail.tags]
    source = "origin"
